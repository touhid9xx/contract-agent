# Local stack.
#   mysql  — the real database (F2)
#   api    — FastAPI behind uvicorn
#   relay  — outbox relay worker (F2); a separate process on purpose, because the
#            API must never publish synchronously and the relay must survive API
#            restarts.
# Kafka: the transport landed in F4 (EVENT_TRANSPORT=kafka, read from .env by
#        both services), but no broker is defined here yet, so the relay defaults
#        to EVENT_TRANSPORT=none and parks events instead of dropping them.
#        Redis/Ollama still arrive with F5 once code actually talks to them.
name: contract-agent

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-contract_agent}
      MYSQL_USER: ${MYSQL_USER:-contract_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      # Bound to loopback: the database is never exposed beyond this host.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: contract-agent-api:dev
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_JSON: ${LOG_JSON:-false}
      # Overrides whatever host-side URL .env holds: inside the network the
      # database is reachable as `mysql`, never as 127.0.0.1.
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-contract_agent}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-contract_agent}?charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  relay:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: contract-agent-api:dev
    # The relay is the same image as the API with a different entry point.
    command:
      - python
      - -m
      - app.workers.outbox_relay
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_JSON: ${LOG_JSON:-false}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-contract_agent}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-contract_agent}?charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  mysql-data:
