# Local stack.
#   mysql     — the real database (F2)
#   migrate   — one-shot `alembic upgrade head` (D10-114). The schema comes from
#               the image, and the API and every worker wait for it to finish.
#   api       — FastAPI behind uvicorn
#   frontend  — the Next.js screen (D10-128). The browser talks only to this, and
#               this container's Next server proxies /api, /health and /health/ready
#               to `api` over the Compose network. Until it existed the stack had no
#               screen: `frontend/` was built and tested by CI and deployed nowhere.
#   relay     — outbox relay worker (F2); a separate process on purpose, because
#               the API must never publish synchronously and the relay must
#               survive API restarts.
#   scheduler — notification scheduler worker (gap 22): claims a due row and sends
#               it, so a reminder goes out because the clock said so, not because
#               somebody pressed a button.
#   scanner   — escalation scanner worker (gap 15): opens an escalation when a
#               contract has gone quiet, so `escalated` is reachable without an
#               operator noticing by hand.
#   documents — a named volume, not a service: uploaded contract documents, mounted
#               at the same path in the API and in every worker (gap 12).
#   prometheus — the scraper for the per-worker /metrics listeners (D10-107) and the
#               loader for the escalation alert rule (D10-111). Its config is in
#               ops/prometheus/ and is the same file CI validates with promtool.
#   alertmanager — the receiver for that rule (D10-116). Until it existed the rule was
#               evaluated and dropped: an entry under `/alerts` and nothing sent, so the
#               page an operator had to act on also had to be open and watched.
#   mailpit   — a catch-all SMTP server with a web UI (D10-116), and the reason a mail this
#               stack produced can be *read* instead of inferred from a log line claiming it
#               was sent. Alertmanager's receiver is aimed here out of the box; the
#               application's own two mail paths reach it by setting
#               NOTIFICATION_TRANSPORT=smtp and SMTP_HOST=mailpit, which `.env.example`
#               shows commented out rather than defaulting — overriding a deployment's
#               transport choice is what decides whether customers get mail at all, so this
#               file does not make that decision for it.
# Kafka: the transport landed in F4 (EVENT_TRANSPORT=kafka, read from .env by
#        every worker), but no broker is defined here yet, so the relay defaults
#        to EVENT_TRANSPORT=none and parks events instead of dropping them.
#        F5 added /health/ready, which probes MySQL and — when a broker is
#        configured — Kafka. No Redis service is defined yet because no code
#        talks to one; it arrives with the slice that first needs one. Ollama is
#        the reverse case: the client that speaks to a model is written and
#        wired (F7, `EXTRACTION_BACKEND=ollama`), so what is missing is the
#        service, not the code. Until one is defined here, `pattern` is what
#        runs — gap 17, and the reason the default is the provable backend.
name: contract-agent

# Two images. `Dockerfile.backend` is ten processes: the API, the attention watcher,
# seven workers and one one-shot migration, each being the API image with a different
# `command`, so worker code is never a second copy of the application.
# `Dockerfile.frontend` (D10-128) is the one service a browser talks to.
# `.github/workflows/ci.yml` builds this file and starts
# every entry point named below (`D10-112`), so that list is not a note about
# deployment — it is what CI executes. The tenth, `migrate`, is the one entry point
# the import list cannot cover, because it starts a console script rather than an
# `app.workers` module; the image job runs it instead (`D10-114`).
#
# The shared half is anchored rather than repeated — seven near-identical service
# blocks are exactly where a `read_only` or a `no-new-privileges` line goes
# missing in one of them, and then one worker is quietly less contained than the
# others.
x-worker: &worker
  build:
    context: .
    dockerfile: Dockerfile.backend
  image: contract-agent-api:dev
  env_file:
    - .env
  environment:
    APP_ENV: ${APP_ENV:-development}
    LOG_JSON: ${LOG_JSON:-false}
    # Overrides whatever host-side URL .env holds: inside the network the
    # database is reachable as `mysql`, never as 127.0.0.1.
    DATABASE_URL: mysql+pymysql://${MYSQL_USER:-contract_agent}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-contract_agent}?charset=utf8mb4
    # Uploaded documents (gap 12). Absolute because every process resolves a
    # relative path against its own working directory, and the mount below is
    # what makes it writable at all: `read_only: true` means an unmounted store
    # path fails at the first upload, not at boot.
    DOCUMENT_STORE_PATH: ${DOCUMENT_STORE_PATH:-/var/lib/contract-agent/documents}
    # D10-107. Every process holds a private copy of the metrics registry, so the
    # API's /metrics answers with the API's counters and nothing else: the series
    # only a worker writes (escalations_total, reminder_plans_total,
    # contracts_expired_total) were scraped by no target at all. Each worker now
    # serves its own copy on WORKER_METRICS_PORT.
    #
    # 0.0.0.0 here, against the loopback default in Settings, for the same reason
    # the healthcheck below is switched off: inside a container the container is
    # the network boundary, and a scraper on the Compose network cannot reach
    # another container's loopback. The host side of each mapping is bound to
    # 127.0.0.1, so nothing is published beyond this machine.
    WORKER_METRICS_HOST: 0.0.0.0
    # Pinned, not read from .env, so the published ports stay exact: every worker
    # container listens on 9101 and only the HOST port differs. Reading it from
    # .env would let a host-side edit desynchronise the mapping, and a `0` there
    # (listener off) would make `up` fail on an unparseable port instead of
    # closing it. This variable still governs a worker run by hand, where seven
    # processes on one loopback do need distinct values.
    WORKER_METRICS_PORT: 9101
  volumes:
    - documents:/var/lib/contract-agent/documents
  depends_on:
    mysql:
      condition: service_healthy
    # D10-114. Ordered, not merely co-started: a worker that starts against a
    # database whose schema is still at revision zero does not fail — it queries
    # tables that do not exist yet, logs the error and retries for ever, which is
    # a crash loop dressed as a healthy stack. `migrate` completes first or
    # nothing started by this anchor starts at all.
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  # The image's HEALTHCHECK asks http://127.0.0.1:8000/health, which only the API
  # answers. Inherited unchanged, every worker would report `unhealthy` for its
  # whole life while working perfectly — a probe that can only ever be wrong, and
  # the kind of noise that teaches an operator to ignore the column. Switched off
  # here rather than left to assert a port nothing listens on; the worker's own
  # liveness signal is its log line per tick.
  healthcheck:
    disable: true

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-contract_agent}
      MYSQL_USER: ${MYSQL_USER:-contract_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      # Bound to loopback: the database is never exposed beyond this host.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"
      interval: 10s
      timeout: 5s
      retries: 12
      # D10-126. The one number here that could be wrong in silence. During
      # `start_period` failed probes are not counted — the container reads
      # `starting` — and once it elapses, `retries` failures are enough to declare a
      # server that is still initialising a dead one. First boot is exactly that
      # case: a virgin datadir has no socket to answer on, so every probe fails
      # until `--initialize` finishes.
      #
      # Measured, not estimated (`D10-126`): on a virgin volume the datadir took
      # 188.1s to answer, while 30s + 12 x 10s declared it `unhealthy` at 147.8s.
      # `docker compose up -d mysql migrate` therefore exited 1 with
      # `dependency failed to start: container ... is unhealthy` and `migrate` never
      # ran — on the first `up` after a `down -v`, and on nobody's second attempt,
      # which is why the earlier run of this stack looked like it worked. 300s
      # covers a datadir initialising twice as slowly as this one, and a server that
      # is genuinely broken is still declared unhealthy at 300 + 12 x 10s.
      start_period: 300s
    restart: unless-stopped

  # D10-114. The schema arrives with the image and is applied by the image: the
  # same container as everything else with `alembic upgrade head` as its entry
  # point, so a deployment runs the migrations this repository ships, at the
  # revision this repository is at. It could not do this before — `Dockerfile
  # .backend` copied `app/` and nothing else, so the chain existed only in a
  # checkout, and "which revision is this deployment on?" was a question about
  # somebody's laptop.
  #
  # It exits, and every service with a schema waits for that exit to be a success,
  # so a failed migration stops the stack rather than letting it boot against a
  # half-built database. `restart: "no"` for the same reason: a migration that
  # fails will fail again, and retrying it for ever hides the error in a restart
  # count. The image is read-only and this writes no file, so it needs no volume —
  # the database is the only thing that changes.
  migrate:
    <<: *worker
    command:
      - alembic
      - upgrade
      - head
    restart: "no"
    # Explicitly overrides the anchor's, which now names `migrate` itself; merged
    # as-is this service would wait for its own completion and never start. MySQL
    # is all it needs, and it is all it declares.
    depends_on:
      mysql:
        condition: service_healthy
    # Inherited from the anchor and wrong here: it probes a metrics port that only
    # a worker module opens, so the container would be judged unhealthy for the
    # few seconds it exists for no reason at all.
    healthcheck:
      disable: true

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: contract-agent-api:dev
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_JSON: ${LOG_JSON:-false}
      # Overrides whatever host-side URL .env holds: inside the network the
      # database is reachable as `mysql`, never as 127.0.0.1.
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-contract_agent}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-contract_agent}?charset=utf8mb4
      # Same absolute path and the same volume as the workers: whichever process
      # writes a document, the one that reads it back finds it.
      DOCUMENT_STORE_PATH: ${DOCUMENT_STORE_PATH:-/var/lib/contract-agent/documents}
    volumes:
      - documents:/var/lib/contract-agent/documents
    depends_on:
      mysql:
        condition: service_healthy
      # D10-114. The API's first request may touch any table; it waits for the
      # schema rather than answering 500s until someone notices.
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      # Deliberately /health (liveness), not /health/ready. A Docker healthcheck
      # drives `restart: unless-stopped`, so pointing it at readiness would
      # restart a healthy API every time MySQL blips — the exact failure the
      # liveness/readiness split exists to avoid. Use /health/ready from a load
      # balancer or orchestrator that removes the instance from rotation instead.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # D10-128. The screen. `frontend/` was built, typechecked, linted and unit-tested
  # by CI and shipped to no container at all, so the stack had an API and no UI: the
  # review queue, consent, the agent decisions and the user list were all routes in
  # one directory and services in neither.
  #
  # The browser never reaches `api`. It loads this origin and this container's Next
  # server forwards `/api/:path*`, `/health` and `/health/ready` — the rewrites in
  # `frontend/next.config.ts` — which keeps the token's origin single, makes CORS
  # irrelevant, and is why the only port published here is this one.
  #
  # No `depends_on: api` on purpose. The rewrite destination is a service *name* and
  # Docker resolves that name per request, so a web tier that starts first renders
  # pages and answers 502 for a screen until the API is up, which is a better failure
  # than a stack that refuses to start because a worker container is still migrating.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # Not `environment:`. The address is read when the image is built, not when a
      # request is served: `next build` writes the rewrite destination into
      # `.next/routes-manifest.json` and the standalone server replays it. Measured —
      # a container whose `environment:` named `http://api:8000` still dialled
      # 127.0.0.1:8000 and logged ECONNREFUSED, because the build had been given no
      # value and taken the fallback in `next.config.ts`. Changing it needs
      # `docker compose build frontend`; setting it here at runtime changes nothing.
      args:
        API_PROXY_URL: http://api:8000
    image: contract-agent-frontend:dev
    ports:
      # Loopback, like every other published port here but the API's.
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      # The standalone server's only runtime write is a cache directory, and a cache
      # is allowed to die with the container — a writable path outside it is what
      # lets `read_only` stay true.
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  relay:
    <<: *worker
    # The relay is the same image as the API with a different entry point.
    command:
      - python
      - -m
      - app.workers.outbox_relay
    # One host port per worker, because all of them listen on 9101 inside their
    # own network namespace and one machine publishes every one. The relay
    # writes no family of its own — its registry holds the API's zeros — so a
    # scrape here answers "is this listener alive", not "is the relay working".
    # `outbox_pending_count` is served by the attention watcher (`D10-134`).
    ports:
      - "127.0.0.1:${RELAY_METRICS_PORT:-9101}:9101"

  scheduler:
    <<: *worker
    # Gap 22. Without it, `scheduled_at` was a column nothing read: a reminder was
    # only ever sent by hand.
    command:
      - python
      - -m
      - app.workers.notification_scheduler
    # The scheduler writes the worker half of `notifications_sent_total` — the
    # sends the clock decided rather than the ones a client asked for, which land
    # in the API's copy of the same family.
    ports:
      - "127.0.0.1:${SCHEDULER_METRICS_PORT:-9102}:9101"

  planner:
    <<: *worker
    # The clock. `scheduler` below claims a notification row and sends it, but until
    # this service existed nothing *wrote* one except a client calling
    # POST /notifications by hand, once per contract — so the 60/30/14 promise was
    # kept manually or not at all. It scans for contracts entering a milestone,
    # reuses the stored decision when one exists (never overwriting an operator's
    # correction), derives a channel only when there is none, and writes the row.
    # Quiet by design: a tick that plans nothing logs at debug, because "nothing is
    # due today" is the normal case and warning on it would train an operator to
    # ignore the column.
    command:
      - python
      - -m
      - app.workers.reminder_planner
    # `reminder_plans_total{outcome}` lives only here: planned, already_planned and
    # refused are the three answers to "is the daily scan doing anything?", and
    # before D10-107 no worker served a scrape at all — the API's `/metrics`
    # answered, and it has never incremented this family.
    ports:
      - "127.0.0.1:${PLANNER_METRICS_PORT:-9103}:9101"

  expiry:
    <<: *worker
    # The other half of the same clock. `planner` stops *planning* once a contract
    # leaves its reminder window, but nothing moved the contract's status when its
    # term actually ran out — so an expired file stayed `active` for ever: counted
    # as live, still scannable for escalation, and still reading to the contact
    # policy as a file no human had closed. Worse, asking for a reminder on one
    # produced a T-14 row dated before the term ended, because `milestone_for`
    # returns the tightest milestone already due and for a past end date that is
    # all of them. This closes the status on the customer's own calendar day and
    # leaves one audit row saying which date did it. It sends nothing.
    command:
      - python
      - -m
      - app.workers.expiry
    # `contracts_expired_total{outcome}` is the sweep's only standing signal, and
    # the one that separates a cleared backlog (still_current) from contracts that
    # will never close (unknown_timezone).
    ports:
      - "127.0.0.1:${EXPIRY_METRICS_PORT:-9104}:9101"

  scanner:
    <<: *worker
    # Gap 15's trigger. Without it, a contract could sit unanswered for a year
    # with nothing in the codebase noticing.
    #
    # It also reports what it opens: once per pass that raised anything, and only
    # if ESCALATION_ALERT_TO names an operator address, one mail saying so. Unset,
    # this stays log-only, which is the default — the escalations are still written
    # and still appear in the queue, they simply reach nobody who is not looking.
    # The alert is sent after the commit, so a refusing relay costs a counter and
    # never an escalation.
    command:
      - python
      - -m
      - app.workers.escalation_scanner
    # `escalations_total{status}` and `escalation_email_failed_total` are written
    # here and nowhere else. The second one is the family `D10-91` names: alerting
    # on `increase(escalation_email_failed_total[1h]) > 0` was unwritable until
    # this port existed, because no target exposed the series the rule reads.
    ports:
      - "127.0.0.1:${SCANNER_METRICS_PORT:-9105}:9101"

  attention:
    <<: *worker
    # Gap 22's residue. `doctor` was the machine-readable half, but a check nobody
    # runs finds nothing: this is the process that runs it. It writes no rows. The
    # verdict goes to the log, where the other workers' verdicts already go, and —
    # only if ATTENTION_ALERT_TO names an operator address — a *change* of verdict
    # also goes out as one mail through the shared SMTP settings. Unset, this is
    # log-only, which is still the default. An explained park (EVENT_TRANSPORT=none)
    # is reported and not alarmed on, which is why this can run on a default install.
    command:
      - python
      - -m
      - app.workers.attention_watch
    # No family of its own either: this worker reads the database and writes log
    # lines. The port is here for the same reason the relay's is — so every worker
    # in the stack answers the same question with the same command, and a missing
    # listener shows up as a refused connection rather than as an empty chart.
    ports:
      - "127.0.0.1:${ATTENTION_METRICS_PORT:-9106}:9101"

  extractor:
    <<: *worker
    # Gap 5. `extract_contract` has been complete since F7 and nothing called it on a
    # timer: the only caller was `python -m app.cli extract --contract-id N`, run by a
    # person. So "the system reads the contract you uploaded" was a promise the
    # deployment kept by hand, and the review queue, the decision policy and the planner
    # were all reading a table that stayed empty until somebody remembered.
    #
    # It takes a stamp, not a row count, as its queue predicate. "Has a stored document
    # and no extracted fields" cannot finish: a scan with no text layer yields no row,
    # so it would match for ever. `extraction_attempted_at` makes "looked, found nothing"
    # a state the queue can leave (0008_extraction_attempted_at).
    #
    # A contract it cannot read — bytes that will not decrypt, a document over
    # EXTRACTION_MAX_DOCUMENT_CHARS — is deliberately left unstamped and retried: those
    # are a volume, key-ring or setting problem, and the retry is what a redeploy
    # repairs. The id cursor keeps them from starving anything behind them.
    command:
      - python
      - -m
      - app.workers.extraction_worker
    # `contracts_extracted_total{outcome}` and `extraction_backlog` are written here and
    # nowhere else. The backlog is a gauge for a reason: the queue has to be able to
    # fall, and "how many documents does this deployment still owe" is the one question
    # that tells a worker keeping up apart from a worker with nothing to do.
    ports:
      - "127.0.0.1:${EXTRACTOR_METRICS_PORT:-9107}:9101"

  pruner:
    <<: *worker
    # Gap 25's residue. `python -m app.cli outbox-prune` has existed since `D10-148`
    # and nothing ever called it, so the retention policy that command implements was
    # a command a person had to remember. A policy nobody runs is a table that grows
    # for the life of the deployment, and the only place that growth is visible is
    # `outbox_pending_count`, which then reads as a backlog the relay is failing to
    # clear. This is the same predicate on a schedule.
    #
    # Off by default (`OUTBOX_RETENTION_DAYS=0`, the shipped value in Settings): how
    # long a deployment keeps settled events is a decision an operator makes about
    # their own database, not a default this repository can pick for them. A tick with
    # retention at 0 opens no session at all — it logs once a day, at info, that the
    # schedule is running and disabled, rather than a per-tick debug line nobody reads.
    #
    # It deletes only what the relay has settled: `prune_terminal_before` carries the
    # status predicate, so no setting here reaches a `pending` or `publishing` row.
    # `OUTBOX_PRUNE_INCLUDE_FAILED=false` also keeps `failed` rows, because a parked
    # event is one an operator was meant to read before it disappears.
    command:
      - python
      - -m
      - app.workers.outbox_pruner
    # It writes no family of its own, so a scrape here answers "did the schedule
    # start", which is the one question a maintenance worker with an empty queue
    # otherwise leaves silent. Deleting is the whole of its work and a delete that
    # reports a count nobody scrapes is still a delete with no witness.
    ports:
      - "127.0.0.1:${PRUNER_METRICS_PORT:-9108}:9101"

  prometheus:
    # D10-111. `D10-91` wrote a rule nobody could load: there was no config in this
    # tree, so `increase(escalation_email_failed_total[1h]) > 0` existed as prose
    # and as a scratch harness. The config now lives in `ops/prometheus/` and is
    # mounted at the image's own default path, so the file `promtool` validates in
    # CI is byte-for-byte the file this service reads.
    #
    # Pinned, because the rule and the config are checked against this version in
    # CI; a floating tag would let the check and the stack drift apart silently. No
    # `depends_on`: a target that is down is what a target list is *for*, and
    # Prometheus says so with `up == 0` instead of refusing to start until six
    # workers are healthy.
    #
    # Mounted is not reloaded. The lifecycle API is off, so there is no
    # `POST /-/reload`: a change to the mounted file arrives only when the process
    # restarts. `D10-159` measured it — the API answered eight targets with the new
    # `pruner:9101` line already on disk, and nine after `docker compose restart
    # prometheus`. Turning the endpoint on instead would publish a mutating route
    # on the container network to save an action taken once per slice.
    image: prom/prometheus:v2.55.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A local stack's series are a view, not records: six hours answers "what
      # happened this afternoon" and bounds the tmpfs below.
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    # The image runs as `nobody`, so the default root-owned tmpfs made it panic on
    # `/prometheus/queries.active` at boot — measured, exit 2, `permission denied`
    # — and the explicit mode is the whole fix. A writable tmpfs is what lets
    # `read_only` stay true; the cost is that history dies with the container,
    # which is the trade a local view makes.
    tmpfs:
      - /prometheus:mode=1777,size=256m
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # `/-/healthy` answers before the first scrape completes, so this says "the
      # process is serving", not "the stack is scraped". The second question is
      # `up{job="workers"} == 1`, which only a scrape can answer.
      test: ["CMD", "/bin/wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  grafana:
    # D10-155. Prometheus has been scraped and alerting since D10-111 and D10-116, and every
    # family `app/core/metrics.py` declares was written for a screen that did not exist: the
    # only way to read one was `curl localhost:9090/api/v1/query`. The dashboards are
    # provisioned from `ops/grafana/`, which is the same argument the Prometheus block makes
    # two screens up — the JSON a test reads in this tree is byte-for-byte the JSON this
    # container loads, because `ops/` is mounted where the provider looks rather than copied
    # to a state volume.
    #
    # Pinned. The reason is stronger here than for the scraper: the dashboard JSON names a
    # datasource uid that only this tree's provisioning file defines, so a tag whose
    # provisioning format moved would load zero dashboards and still answer `/api/health`
    # with 200. `tests/test_grafana_provisioning.py` guards the uid pair without a
    # container; the CI smoke proves this tag actually serves them.
    image: grafana/grafana:11.3.0
    volumes:
      # Mounted by leaf, not as `./ops/grafana/provisioning` whole. Measured: the whole tree
      # makes Grafana log, at error level on every boot, `can't read alerting provisioning
      # files from directory /etc/grafana/provisioning/alerting: no such file or directory`,
      # because this tree ships no Grafana alert rules — the rules are Prometheus rule files
      # in `ops/prometheus/`. An error line that is always present is a line people learn to
      # skip, and that is how the next real one gets missed.
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      # Loopback only. Grafana serves a login form and, with anonymous access off, refuses
      # everything else — but the panels name queue depths and contract counts, and a
      # published port is how a local stack's operational view becomes somebody else's.
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      # Written as a refusal, like the two MYSQL passwords: a `:-admin` default would be a
      # well-known password on every machine that runs this stack, and the example file
      # carries a value so `cp .env.example .env` still starts.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Stated rather than relied on. Both are already the upstream defaults; writing them
      # down means a future default cannot quietly turn this deployment into an
      # unauthenticated read of the panels above, or into an open sign-up form.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Grafana reports usage and checks for updates by default. This deployment's premise is
      # that nothing leaves the machine, so both are off here instead of left as a default a
      # later version could flip without this file changing.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # The provisioner rescans its directory this often; without it a dashboard edited in
      # `ops/` needs a container restart even though `dashboards.yml` asks for 30s.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/contract-agent.json
    # Measured: this image runs as uid 472 and writes `grafana.db` into `/var/lib/grafana`
    # on boot, so the root-owned-tmpfs trap the Prometheus block records applies unchanged
    # and the explicit mode is again the whole fix — `read_only` stays true. The cost is the
    # same trade: the panels survive a restart because they are files, and anything starred
    # or edited in the UI does not, which is the point of provisioning them.
    tmpfs:
      - /var/lib/grafana:mode=1777,size=64m
      - /tmp:mode=1777,size=16m
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Measured inside this image: `/usr/bin/wget --spider -q .../api/health` exits 0. It
      # says "the server is serving", never "a dashboard rendered" — the second question is
      # answered by the dashboard endpoint in CI, and by `up` for the thing being plotted.
      test: ["CMD", "/usr/bin/wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

  # D10-116. The receiver the rule never had. `D10-111` recorded the gap in its own words —
  # "no Alertmanager, the rule fires into an empty `ALERTS`, nobody paged" — and the shape
  # of it was: `promtool` validated the rule, Prometheus evaluated it, `/alerts` listed it,
  # and that list was the only place it ever existed. A page that has to be open and watched
  # is not a page.
  #
  # Pinned for the same reason the Prometheus service is: `amtool check-config` in CI reads
  # this service's own file, so a floating tag would let the check validate an Alertmanager
  # the stack does not run. No `depends_on: mailpit` either — the same argument the
  # Prometheus block makes about its targets: a relay that is down is what a retry and a log
  # line are *for*, and making the receiver wait for a mail server would turn "start the
  # receiver" into "start the stack".
  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./ops/alertmanager:/etc/alertmanager:ro
    ports:
      # Loopback only, and not decoration: Alertmanager accepts unauthenticated posts on
      # `/api/v2/alerts` on this interface, so publishing it would be an open endpoint that
      # sends mail to the operator.
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    # The image runs as `nobody` (measured: uid 65534), so the root-owned-tmpfs trap the
    # Prometheus service records applies here unchanged — the explicit mode is the whole fix
    # — and `read_only` stays true. The cost is that silences and the notification log die
    # with the container: this is a local stack's receiver, not a record of who was paged.
    tmpfs:
      - /alertmanager:mode=1777,size=64m
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # `/-/healthy` answers once the receiver is serving, which is the claim worth making:
      # "Alertmanager is up", never "an alert was delivered". Delivery is the smoke in
      # `.github/workflows/ci.yml`, because only an alert that arrives can answer that.
      test: ["CMD", "/bin/wget", "--spider", "-q", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # D10-116. A catch-all SMTP server with a web UI. The escalation scanner and the attention
  # watcher can each mail the operator, and until this service existed the only evidence
  # that either had was the log line saying so, on a transport whose real relay nobody runs
  # locally.
  #
  # It accepts unauthenticated SMTP from the Compose network and keeps messages in memory
  # (no `MP_DATABASE`), so nothing here is a record: the UI at http://127.0.0.1:8025 is a
  # window that closes with the container. The SMTP port is deliberately NOT published — a
  # relay already listening on :1025 is a collision a local stack does not need, and every
  # container that mails it is already on the network.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    # The image's own HEALTHCHECK (`mailpit ready`) is the right probe, so unlike the workers
    # it is left switched on: this is a server, not a tick that exits.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  mysql-data:
  # Uploaded contract documents, shared by the API and every worker. A named
  # volume rather than a bind mount so the files survive `docker compose down`
  # and never depend on the host's path layout.
  documents:
