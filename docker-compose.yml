# ============================================================
# Local development stack — all FREE alternatives to paid services.
# Start: docker compose up -d
# Stop:  docker compose down
# Reset: docker compose down -v  (⚠️ deletes all data)
#
# Services:
#   MySQL 8         → 3306  (contract_agent DB)
#   Kafka           → 9092  (host) / 29092 (internal)
#   Zookeeper       → 2181
#   Redis           → 6379  (token blacklist, rate limit, idempotency)
#   Jaeger          → 16686 (UI), 4317 (OTLP gRPC) [citation:5][citation:12]
#   Prometheus      → 9090  [citation:13]
#   Grafana         → 3001  (UI) [citation:7]
# ============================================================

services:
  # ============================================================
  # MySQL 8 — primary datastore
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: contract-agent-mysql
    restart: unless-stopped
    environment:
      # Root credentials
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      # App DB + regular user — MUST be set for `contract` user creation
      MYSQL_DATABASE: ${MYSQL_DB:-contract_agent}
      MYSQL_USER: ${MYSQL_USER:-contract}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-contract}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # Healthcheck uses app credentials (${MYSQL_USER}/${MYSQL_PASSWORD})
      # `${VAR:-default}` interpolation is evaluated by docker-compose at
      # container runtime — defaults only apply if vars are truly unset.
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s   # MySQL first-run init takes 60-120s on Windows
    networks:
      - contract-agent-net

  # ============================================================
  # Zookeeper — required by Kafka (Confluent 7.4.x)
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: contract-agent-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contract-agent-net

  # ============================================================
  # Kafka — event bus (prod) / StrikeMQ (local alternative)
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.4.4
    container_name: contract-agent-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - contract-agent-net

  # ============================================================
  # Redis — refresh token blacklist, rate limit, idempotency
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: contract-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - contract-agent-net

  # ============================================================
  # Jaeger — distributed tracing (all-in-one, memory storage)
  # ============================================================
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: contract-agent-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
      SPAN_STORAGE_TYPE: memory
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "14268:14268"   # Jaeger collector HTTP
      - "14250:14250"   # gRPC for collector
      - "9411:9411"     # Zipkin-compatible
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contract-agent-net

  # ============================================================
  # Prometheus — metrics scrape + alerting
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: contract-agent-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - contract-agent-net

  # ============================================================
  # Grafana — dashboards (auto-provisioned from ops/grafana)
  # ============================================================
  grafana:
    image: grafana/grafana:10.4.2
    container_name: contract-agent-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - contract-agent-net

# ============================================================
# NETWORKS
# ============================================================
networks:
  contract-agent-net:
    driver: bridge

# ============================================================
# VOLUMES
# ============================================================
volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
