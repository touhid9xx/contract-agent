# Local stack.
#   mysql     — the real database (F2)
#   api       — FastAPI behind uvicorn
#   relay     — outbox relay worker (F2); a separate process on purpose, because
#               the API must never publish synchronously and the relay must
#               survive API restarts.
#   scheduler — notification scheduler worker (gap 22): claims a due row and sends
#               it, so a reminder goes out because the clock said so, not because
#               somebody pressed a button.
#   scanner   — escalation scanner worker (gap 15): opens an escalation when a
#               contract has gone quiet, so `escalated` is reachable without an
#               operator noticing by hand.
#   documents — a named volume, not a service: uploaded contract documents, mounted
#               at the same path in the API and in every worker (gap 12).
# Kafka: the transport landed in F4 (EVENT_TRANSPORT=kafka, read from .env by
#        every worker), but no broker is defined here yet, so the relay defaults
#        to EVENT_TRANSPORT=none and parks events instead of dropping them.
#        F5 added /health/ready, which probes MySQL and — when a broker is
#        configured — Kafka. No Redis service is defined yet because no code
#        talks to one; it arrives with the slice that first needs one. Ollama is
#        the reverse case: the client that speaks to a model is written and
#        wired (F7, `EXTRACTION_BACKEND=ollama`), so what is missing is the
#        service, not the code. Until one is defined here, `pattern` is what
#        runs — gap 17, and the reason the default is the provable backend.
name: contract-agent

# One image, five processes: each worker is the API image with a different
# `command`, so worker code is never a second copy of the application. The shared
# half is anchored rather than repeated — three near-identical service blocks are
# exactly where a `read_only` or a `no-new-privileges` line goes missing in one of
# them, and then one worker is quietly less contained than the other two.
x-worker: &worker
  build:
    context: .
    dockerfile: Dockerfile.backend
  image: contract-agent-api:dev
  env_file:
    - .env
  environment:
    APP_ENV: ${APP_ENV:-development}
    LOG_JSON: ${LOG_JSON:-false}
    # Overrides whatever host-side URL .env holds: inside the network the
    # database is reachable as `mysql`, never as 127.0.0.1.
    DATABASE_URL: mysql+pymysql://${MYSQL_USER:-contract_agent}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-contract_agent}?charset=utf8mb4
    # Uploaded documents (gap 12). Absolute because every process resolves a
    # relative path against its own working directory, and the mount below is
    # what makes it writable at all: `read_only: true` means an unmounted store
    # path fails at the first upload, not at boot.
    DOCUMENT_STORE_PATH: ${DOCUMENT_STORE_PATH:-/var/lib/contract-agent/documents}
  volumes:
    - documents:/var/lib/contract-agent/documents
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  # The image's HEALTHCHECK asks http://127.0.0.1:8000/health, which only the API
  # answers. Inherited unchanged, every worker would report `unhealthy` for its
  # whole life while working perfectly — a probe that can only ever be wrong, and
  # the kind of noise that teaches an operator to ignore the column. Switched off
  # here rather than left to assert a port nothing listens on; the worker's own
  # liveness signal is its log line per tick.
  healthcheck:
    disable: true

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-contract_agent}
      MYSQL_USER: ${MYSQL_USER:-contract_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      # Bound to loopback: the database is never exposed beyond this host.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: contract-agent-api:dev
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_JSON: ${LOG_JSON:-false}
      # Overrides whatever host-side URL .env holds: inside the network the
      # database is reachable as `mysql`, never as 127.0.0.1.
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-contract_agent}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-contract_agent}?charset=utf8mb4
      # Same absolute path and the same volume as the workers: whichever process
      # writes a document, the one that reads it back finds it.
      DOCUMENT_STORE_PATH: ${DOCUMENT_STORE_PATH:-/var/lib/contract-agent/documents}
    volumes:
      - documents:/var/lib/contract-agent/documents
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      # Deliberately /health (liveness), not /health/ready. A Docker healthcheck
      # drives `restart: unless-stopped`, so pointing it at readiness would
      # restart a healthy API every time MySQL blips — the exact failure the
      # liveness/readiness split exists to avoid. Use /health/ready from a load
      # balancer or orchestrator that removes the instance from rotation instead.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  relay:
    <<: *worker
    # The relay is the same image as the API with a different entry point.
    command:
      - python
      - -m
      - app.workers.outbox_relay

  scheduler:
    <<: *worker
    # Gap 22. Without it, `scheduled_at` was a column nothing read: a reminder was
    # only ever sent by hand.
    command:
      - python
      - -m
      - app.workers.notification_scheduler

  scanner:
    <<: *worker
    # Gap 15's trigger. Without it, a contract could sit unanswered for a year
    # with nothing in the codebase noticing.
    command:
      - python
      - -m
      - app.workers.escalation_scanner

  attention:
    <<: *worker
    # Gap 22's residue. `doctor` was the machine-readable half, but a check nobody
    # runs finds nothing: this is the process that runs it. It writes no rows. The
    # verdict goes to the log, where the other workers' verdicts already go, and —
    # only if ATTENTION_ALERT_TO names an operator address — a *change* of verdict
    # also goes out as one mail through the shared SMTP settings. Unset, this is
    # log-only, which is still the default. An explained park (EVENT_TRANSPORT=none)
    # is reported and not alarmed on, which is why this can run on a default install.
    command:
      - python
      - -m
      - app.workers.attention_watch

volumes:
  mysql-data:
  # Uploaded contract documents, shared by the API and every worker. A named
  # volume rather than a bind mount so the files survive `docker compose down`
  # and never depend on the host's path layout.
  documents:
