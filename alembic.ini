# Alembic configuration for contract-agent.
#
# Why is `sqlalchemy.url` a placeholder?
#     env.py reads the real DSN from Settings (.env), so this file is
#     environment-agnostic. Keep the placeholder so alembic can parse
#     the file even before env.py runs.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Placeholder — env.py overrides this at runtime with settings.database_url.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Post-write hooks run on newly generated revision scripts.
# Lint with ruff and format automatically:
hooks = ruff_format

ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME


# ============================================================
# LOGGING
# ============================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
