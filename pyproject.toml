[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-agent"
version = "0.1.0"
description = "AI Contract-Expiry Notification Agent — full lifecycle automation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Contract Agent Team" }]

dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    # Pin starlette <1.0 — FastAPI 0.115+ is incompatible with starlette 1.x.
    # prometheus-fastapi-instrumentator 8.1.0 declares `starlette>=1.0.0` as a
    # transitive dependency (over-constrained); we override it here because
    # FastAPI 0.115+ requires `starlette>=0.40,<0.53`.
    "starlette>=0.40.0,<0.53.0",

    # --- Database ---
    "sqlalchemy>=2.0.36,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pymysql>=1.1.1,<2.0.0",
    "cryptography>=43.0.3,<45.0.0",

    # --- Auth & security ---
    "pyjwt>=2.9.0,<3.0.0",
    "passlib[argon2]>=1.7.4,<2.0.0",
    "argon2-cffi>=23.1.0,<24.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "pybreaker>=1.2.0,<2.0.0",
    "pyclamd>=0.4.0,<1.0.0",

    # --- Logging & observability ---
    "structlog>=24.4.0,<26.0.0",
    "prometheus-fastapi-instrumentator>=8.0.1,<9.0.0",
    "prometheus-client>=0.21.0,<1.0.0",
    "opentelemetry-api>=1.28.0,<2.0.0",
    "opentelemetry-sdk>=1.28.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0,<1.0.0",
    "opentelemetry-instrumentation-httpx>=0.49b0,<1.0.0",
    "opentelemetry-exporter-otlp>=1.28.0,<2.0.0",

    # --- Events ---
    "aiokafka>=0.12.0,<0.13.0",
    "redis>=5.2.0,<6.0.0",

    # --- Scheduling ---
    "apscheduler>=3.10.4,<4.0.0",

    # --- Extraction ---
    "pdfplumber>=0.11.4,<1.0.0",
    "regex>=2024.11.6",
    "rapidfuzz>=3.10.1,<4.0.0",
    "spacy>=3.8.2,<4.0.0",

    # --- AI Agent ---
    "smolagents>=1.2.0,<2.0.0",
    "ollama>=0.3.3,<1.0.0",
    "mlflow>=2.17.2,<3.0.0",
    "transformers>=4.46.3,<5.0.0",
    "torch>=2.5.1,<3.0.0",
    "edge-tts>=6.1.12,<7.0.0",

    # --- Notifications ---
    "httpx>=0.27.2,<1.0.0",
    "aiosmtplib>=3.0.2,<4.0.0",

    # --- Voice ---
    "pyVoIP>=1.6.8,<2.0.0",

    # --- Utilities ---
    "python-dotenv>=1.0.1,<2.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "orjson>=3.10.11,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.4,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "testcontainers[mysql]>=4.8.2,<5.0.0",
    "locust>=2.32.4,<3.0.0",
    "bandit[toml]>=1.7.10,<2.0.0",
    "pip-audit>=2.7.3,<3.0.0",
    "pre-commit>=4.0.1,<5.0.0",
]

[project.scripts]
contract-agent = "contract_agent.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"contract_agent" = ["notifications/templates/**/*", "agent/prompts/*"]

# ============================================================
# RUFF — lint + format
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = ["venv", ".venv", "build", "dist", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = [
    "E501",
    "B008",
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "B011", "N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["contract_agent"]

# ============================================================
# MYPY — strict
# ============================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["venv", ".venv", "build", "dist", "alembic/versions"]

# Packages WITHOUT py.typed marker — tell mypy to trust them.
# This silences "Skipping analyzing ... missing library stubs" errors.
[[tool.mypy.overrides]]
module = [
    "aiokafka.*",
    "pyclamd.*",
    "pyVoIP.*",
    "smolagents.*",
    "pdfplumber.*",
    "edge_tts.*",
]
ignore_missing_imports = true

# ============================================================
# PYTEST
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/contract_agent",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=85",
]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error::DeprecationWarning",
    # anyio 4.15.0 deprecated the `anyio.abc.BlockingPortal` alias, but
    # starlette.testclient still references it at import time. Remove this
    # ignore once starlette migrates to `anyio.from_thread.BlockingPortal`.
    # Upstream: https://github.com/Kludex/starlette/issues/3497
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

# ============================================================
# COVERAGE
# ============================================================
[tool.coverage.run]
source = ["src/contract_agent"]
branch = true
omit = [
    "*/alembic/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

# ============================================================
# BANDIT
# ============================================================
[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]  # assert_used — pytest uses asserts
