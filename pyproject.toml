# Tooling configuration for the Python backend.
#
# Deliberately contains no [project] table: the backend is not installed as a
# distribution, it is deployed from backend/ (see Dockerfile.backend) and run
# with `uvicorn app.main:app` from that directory. Keeping the tool config at
# the repository root means ruff, mypy, bandit and pytest all discover it when
# pre-commit invokes them from the repo root.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]
extend-exclude = [
    "venv",
    ".venv",
    "demo",
    "frontend",
    "node_modules",
    ".next",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "PT",    # flake8-pytest-style
    "RUF",   # ruff-specific
    "S",     # flake8-bandit
    "T20",   # flake8-print (no stray print() in app code)
]
ignore = [
    "E501", # line length is enforced by the formatter
    "B008", # FastAPI Depends() in defaults is the documented idiom
    "S104", # binding 0.0.0.0 is required inside containers
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "S105", "S106", "T20"]
"scripts/**" = ["T20"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
files = ["backend/app"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["backend.tests.*"]
disallow_untyped_defs = false

# kafka-python ships no `py.typed` and no stubs, so its symbols are untyped. The
# import is confined to app/workers/publishers.py, where the producer is cast to
# a local Protocol; without this override mypy strict fails on a missing
# implementation rather than on a real type error.
[[tool.mypy.overrides]]
module = ["kafka", "kafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
markers = [
    "live: hits a real external service (Ollama, Kafka, SMTP). Opt-in only.",
    "integration: requires the docker-compose stack (DB, Redis, Kafka).",
]

[tool.coverage.run]
source = ["backend/app"]
branch = true
parallel = false

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["backend/tests", "demo", "venv", ".venv", "frontend", "node_modules"]
