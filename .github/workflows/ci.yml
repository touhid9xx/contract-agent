name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ============================================================
  # BACKEND — lint, type-check, test, migration round-trip, schema drift
  # ============================================================
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: contract_agent_test
          MYSQL_USER: contract
          MYSQL_PASSWORD: contract
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'x'.repeat(64) }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=' }}
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: contract
      MYSQL_PASSWORD: contract
      MYSQL_DB: contract_agent_test
      REDIS_URL: redis://127.0.0.1:6379/0
      KAFKA_ENABLED: "false"
      OTEL_ENABLED: "false"
      LLM_MOCK: "true"
      SMS_MOCK: "true"
      EMAIL_MOCK: "true"
      VOICE_MOCK: "true"
      SKIP_VIRUS_SCAN: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Mypy (strict)
        run: mypy src

      - name: Bandit (security)
        run: bandit -r src -c pyproject.toml -ll

      - name: Pytest (with coverage)
        run: pytest -v --cov=src/contract_agent --cov-report=xml --cov-fail-under=85

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

      # Migration round-trip (M4 adds alembic; this step becomes real then)
      - name: Alembic round-trip
        if: hashFiles('alembic.ini') != ''
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
        env:
          DATABASE_URL: mysql+pymysql://contract:contract@127.0.0.1:3306/contract_agent_test

      - name: Schema drift check
        run: python -m scripts.check_schema_drift

  # ============================================================
  # FRONTEND — eslint, tsc, vitest, build, playwright, axe
  # ============================================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npx eslint . --max-warnings=0

      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Prettier check
        working-directory: frontend
        run: npx prettier --check .

      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:unit:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E + a11y
        working-directory: frontend
        run: npx playwright test
        env:
          HUSKY: 0

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  # ============================================================
  # SECURITY — dependency scanning (bandit runs in backend job)
  # ============================================================
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --desc on

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # DOCKER — build both images (M23 adds prod stack)
  # ============================================================
  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: contract-agent-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: contract-agent-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: contract-agent-backend:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
