# Continuous integration.
#
# Why this file exists: until D10-46 every gate in this repository ran from a
# developer's machine. `.husky/pre-commit` calls `pre-commit run --all-files`, so
# the gate was real but *optional* — a `--no-verify` commit, a second clone, or a
# fork all bypassed it, and nothing ever ran the backend test suite at all
# (pytest is not a pre-commit hook). CI is here to make the existing gate
# mandatory and to add the two checks the hook cannot express: the pytest suite
# and the MySQL-only integration tests. The first half is not finished by this
# file: it runs the checks, and only branch protection can require them —
# measured off by `D10-75`, so a direct push to `main` still bypasses
# everything below.
#
# Design rules, in the order they decided the shape below:
#
#   1. Mirror, do not invent. Each job runs the *same command* the corresponding
#      hook already runs (`ruff check`, `mypy`, `bandit -c pyproject.toml`,
#      `npm run typecheck|lint|test`), so a green pipeline and a green hook mean
#      the same thing. Where CI differs it is only by dropping the hooks'
#      `--fix` flags, because a runner must report a defect, never repair it and
#      then pass.
#   2. Separate jobs, not one script. A single job would be one round trip to
#      find out that a failure was in `ruff` rather than `mypy`. Each job also
#      fails independently, so four of six green is readable at a glance.
#   3. `next build` runs, but only because it was verified first. It is the one
#      check that catches a server/client-boundary error `tsc` cannot see, and
#      it needs the whole Next toolchain plus any environment it reads at build
#      time — so it was run locally against `frontend/` *before* being wired in,
#      rather than added and hoped for. A pipeline that is red on its first run
#      teaches people to ignore it, which is why the order was inverted.
#      DECISIONS.md D10-47 records what the first run found.
#
# Versions: Node 22 and Python 3.13 are both pinned by other files in this
# repository rather than chosen here. `engines.node` says ">=20" and
# `@types/node` is `^22`, so 22 is the version the frontend is typed against.
# Python 3.13 is what `Dockerfile.backend` ships; `pyproject.toml` targets 3.12
# for ruff/mypy, which is a *floor*, not a different interpreter.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. No job here publishes, tags or comments, so nothing
# needs more than this, and a compromised action cannot push with a token it
# never should have been given.
permissions:
  contents: read

# One run per branch: a second push supersedes the first, so the queue does not
# fill with runs describing code that no longer exists.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------- python lint
  # The three static gates, in the same order and with the same arguments as
  # the `ruff`, `ruff-format`, `mypy` and `bandit` hooks in
  # `.pre-commit-config.yaml`.
  python-static:
    name: python static (ruff, mypy strict, bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      # No `--fix`: the hook repairs and fails, CI must only fail.
      - name: ruff check
        run: ruff check backend

      # Equivalent of the `ruff-format` hook, which fails when it rewrote a file.
      - name: ruff format (check only)
        run: ruff format --check backend

      - name: mypy (strict)
        run: python -m mypy

      - name: bandit
        run: bandit -c pyproject.toml -r backend/app -q

  # ------------------------------------------------------------- backend tests
  # Not a pre-commit hook, so before this job existed the ~470-test suite only
  # ever ran when somebody remembered to run it. This is the single largest
  # coverage gain in the file. `mypy` above is the type gate; this is behaviour.
  backend-tests:
    name: backend tests (pytest, sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      # `-m "not integration"` is explicit rather than relying on the marker
      # being skipped: the MySQL job below is the only place those run, and a
      # silent skip here would hide the day they start being collected.
      - name: pytest
        run: python -m pytest -m "not integration"

      # The one thing pytest cannot prove. Every test above reaches the app
      # through `TestClient`, which is an in-process ASGI call: no socket is
      # opened, no uvicorn exists, and nothing between two processes can
      # disagree. This step boots the app under a real uvicorn on a loopback
      # port, against a file-backed SQLite database, and drives the journey over
      # HTTP with httpx — so it is the only check that the error envelope the
      # frontend parses is the one the *server* sends, and the only one that
      # exercises the `create-admin` → login order an operator actually runs.
      #
      # No service container and no new dependency: httpx and uvicorn are both
      # already installed above, and the script removes its temporary database
      # and document store on success. It is not collected by pytest (the file
      # is `smoke_journey.py`, not `test_*.py`) precisely so that it runs here
      # once, as a journey, rather than as 108 separately-failing test cases.
      - name: smoke journey (real uvicorn, real socket)
        run: python backend/tests/smoke_journey.py

      # The companion for the *worker* process boundary. `smoke_journey.py` above
      # drives the API, which is the one process whose metrics were always
      # scrapeable. `D10-107` added a listener to each of the six workers precisely
      # because their counters existed nowhere else — and until this step, the only
      # evidence that a worker's own series could be read was a parse of
      # `docker-compose.yml` plus unit tests that filled the registry themselves.
      # This starts `app.workers.expiry` as a subprocess on a loopback port against
      # a temporary SQLite database, and fails unless the sweep's own
      # `contracts_expired_total{outcome="unknown_timezone"}` arrives over the
      # socket while a family the sweep never writes arrives with no sample.
      #
      # ~~That was one worker of six.~~ **`D10-110` finished the sentence:** the step
      # now starts all six worker modules, each on its own port, and fails unless
      # every one answers a scrape, holds no sample for a family another worker
      # writes, and releases its port on death. The seeded zero `D10-109` added is
      # asserted in the relay, which can never write it — which is why the alert
      # rule has to name the scanner's *port* and not merely some port.
      #
      # No service container, no new dependency, and not collected by pytest: the
      # file is `smoke_worker_metrics.py`, so it runs here once rather than as a
      # test that spawns an interpreter per case.
      - name: smoke worker metrics (six real workers, six real sockets)
        run: python backend/tests/smoke_worker_metrics.py

      # And the companion `D10-108` left open. That step scraped a worker whose
      # counter is incremented on a branch the seed forces; this one scrapes the
      # counter `D10-91` wrote an alert rule for, on the path where the mail could
      # not be sent. `increase(escalation_email_failed_total[1h]) > 0` is the rule
      # that tells an operator nobody was ever told about an escalation, and until
      # this step it had only ever been exercised by a `RefusingAlerter` stub that
      # raises on request — never by the real SMTP sender over a real socket.
      #
      # This starts `app.workers.escalation_scanner` as a subprocess against a
      # temporary SQLite database seeded with a contract silent longer than the
      # response window, with `NOTIFICATION_TRANSPORT=smtp` aimed at a loopback
      # port nothing is listening on. The kernel refuses the connection, and the
      # script fails unless the refusal is counted on the scanner's own listener,
      # the escalation row survives it, and the port is released on death.
      - name: smoke escalation alert (real refusal, real socket)
        run: python backend/tests/smoke_escalation_alert.py

  # ------------------------------------------------------ mysql integration
  # The six guarantees `backend/tests/test_mysql_integration.py` lists in its
  # docstring — SKIP LOCKED claiming, real ENUMs, the dispatch lock, NUMERIC
  # scale, refresh-token row locks, cascading FKs — are unobservable on SQLite.
  # Locally they skip silently when no MySQL answers, which is why they had only
  # ever been run by hand. A service container makes them mandatory.
  mysql-integration:
    name: backend integration tests (mysql 8.4)
    runs-on: ubuntu-latest

    services:
      mysql:
        # Same tag as `docker-compose.yml`, so CI proves the version that ships.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: contract_agent_test
        ports:
          - 3306:3306
        # Without this the first test races the server's first-boot init and
        # fails with "cannot connect" rather than a real assertion.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

    env:
      # Root, not the application user: these tests drop and recreate the schema
      # and some need CREATE. The database is a throwaway container on a
      # loopback port, and `test_mysql_integration.py` documents this variable as
      # the way to point at a disposable server. It is never a real one.
      MYSQL_TEST_URL: mysql+pymysql://root:root@127.0.0.1:3306/contract_agent_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      # `--strict-markers` from pyproject is already on; `-m integration` selects
      # exactly the module above.
      #
      # The suite *skips* rather than fails when it cannot reach a server, so a
      # service-container run that skipped would be green while proving nothing.
      # `pipefail` keeps pytest's own exit status through `tee`, and the grep
      # turns a skip into a failure. `-rs` is what puts the reason in the log, so
      # a red run explains itself instead of just saying "1 skipped".
      - name: pytest (integration only, skips are failures)
        run: |
          set -o pipefail
          python -m pytest -m integration backend/tests -q -rs | tee /tmp/integration.log
          if grep -qi skipped /tmp/integration.log; then
            echo "::error::integration tests skipped instead of running - the suite proved nothing"
            exit 1
          fi

  # ------------------------------------------------------------------ frontend
  # The three hooks that drive `scripts/run-frontend-check.mjs`, invoked
  # directly, plus the production build. `npm ci` (not `npm install`) so the
  # committed lockfile is what is tested — a floating resolution would make CI
  # prove a different tree than the developer's.
  frontend:
    name: frontend (typecheck, eslint, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: eslint
        run: npm run lint

      - name: vitest
        run: npm test

      # The fourth check, and the only one that exercises the server rendering
      # path: `tsc --noEmit` proves types and `vitest` proves components in
      # jsdom, but neither renders a page in an RSC pass. This step is what
      # caught the app having no production build at all (D10-47) — it had never
      # been run, so a missing next-intl request config went unnoticed for
      # months. `next build` needs no backend: the /api and /health rewrites are
      # resolved per request, not at build time.
      - name: production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ------------------------------------------------------------- demo frontend
  # A separate app with its own lockfile. The `demo-frontend-typecheck` hook was
  # added because nothing checked this tree at all until its fixtures had already
  # drifted from the real wire shape; the same drift is possible on a fork.
  demo-frontend:
    name: demo frontend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: typecheck
        run: npm run typecheck

  # ------------------------------------------------------------------ hygiene
  # The cheap file-shape hooks, plus `gitleaks` — which is bound to the `manual`
  # stage locally (D1-03) and therefore never ran automatically anywhere. The
  # hook is ordered to require Docker, which `ubuntu-latest` provides, so CI is
  # the one place the documented command — `pre-commit run gitleaks --all-files
  # --hook-stage manual`, the flag being required (D10-51) — can be made
  # mandatory. Runs with no npm/pip installs beyond pre-commit itself: each hook
  # brings its own isolated environment from its pinned rev.
  hygiene:
    name: hygiene + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # gitleaks scans history, so it needs more than the one commit it would
        # otherwise get; this is what makes the scan equivalent to a local run
        # against a full clone.
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0

      # Named explicitly so the Python/Node hooks are not run twice: `ruff`,
      # `mypy`, `bandit` and the three frontend hooks are their own jobs above,
      # and `--all-files` here would need a full venv plus two `npm ci`s to
      # repeat them. Hook ids are the ones in `.pre-commit-config.yaml`.
      #
      # One hook per invocation, in a loop — not one command with eleven hook
      # ids. `pre-commit run` takes a *single* hook-id positional (`nargs="?"`,
      # "A single hook-id to run"), so the list form is an argparse error:
      # `unrecognized arguments: …`, exit 2, before any hook runs. Written that
      # way first, then executed rather than assumed (D10-49). `bash -e` is the
      # default shell here, so the loop stops at the first hook that fails.
      - name: file hygiene
        run: |
          for hook in \
            check-yaml check-toml check-json check-merge-conflict \
            check-added-large-files check-case-conflict detect-private-key \
            forbid-submodules end-of-file-fixer trailing-whitespace \
            mixed-line-ending ; do
            pre-commit run --all-files "$hook"
          done

      # Manual-stage hook, run by name. This is the command in the hook's own
      # comment, so CI and an operator run the same thing.
      #
      # `--hook-stage manual` is *required*, not decoration. `pre-commit run
      # <id>` filters the named hook by stage as well, so naming a
      # `stages: [manual]` hook without it is refused with `No hook with id
      # 'gitleaks' in stage 'pre-commit'` and exit 1 — before any hook runs.
      # That is the whole of run #1's failure (D10-51): the step died in the
      # same second it started, which is the signature of a refusal, not a
      # finding. A scan that had run and found a secret could not complete in
      # zero seconds.
      - name: gitleaks
        run: pre-commit run gitleaks --all-files --hook-stage manual

  # ------------------------------------------------------- observability
  # `ops/prometheus/` is configuration, so nothing that runs Python or TypeScript
  # ever reads it: a rule with a typo in its expression is a file an operator copies
  # into a stack and learns about only when the alert that never fired is the one
  # they needed. `promtool` is Prometheus's own loader and rule engine, in the same
  # pinned image `docker-compose.yml` runs, so this asks Prometheus whether the
  # files are valid instead of asking a YAML parser whether they parse.
  #
  # `-w /etc/prometheus` is not decoration: `rule_files` inside `rules.test.yml` is
  # relative, and promtool resolves it against the working directory.
  #
  # `D10-116` added the other half: a rule that fires into nothing is not an alert.
  # `promtool` cannot see the difference — an `alerting:` block naming a host that
  # resolves to nothing passes every check above — so the receiver's own config is
  # validated by Alertmanager's loader, and the last step runs the hop for real:
  # Prometheus -> Alertmanager -> SMTP -> a mailbox, in the pinned images the stack
  # runs. That step is the only one in this job that can answer "is a person told".
  observability:
    name: observability (prometheus config, alert rule, alert delivery)
    runs-on: ubuntu-latest
    # The tags live here and are read from Compose below, so a version bump cannot
    # make this job validate a Prometheus or an Alertmanager the stack does not run.
    env:
      PROM_VERSION: v2.55.0
      AM_VERSION: v0.27.0
    steps:
      - uses: actions/checkout@v4

      - name: pull the pinned Prometheus image
        run: docker pull "prom/prometheus:${PROM_VERSION}"

      - name: the config loads, including the rule file it names
        run: |
          docker run --rm \
            -v "$PWD/ops/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool "prom/prometheus:${PROM_VERSION}" \
            check config /etc/prometheus/prometheus.yml

      - name: the rule fires on one refusal and is silent on a fleet of zeros
        run: |
          docker run --rm \
            -v "$PWD/ops/prometheus:/etc/prometheus:ro" \
            -w /etc/prometheus \
            --entrypoint /bin/promtool "prom/prometheus:${PROM_VERSION}" \
            test rules /etc/prometheus/rules.test.yml

      # D10-116. The receiver file `ops/prometheus/rules.yml` has needed since D10-111
      # and never had: `promtool` reads the *sender* side only, so an `alerting:` block
      # pointing at an Alertmanager that does not exist is a file that passes every
      # check above. This asks Alertmanager whether the file it is handed is valid —
      # the route, the receiver, the `to`, the SMTP relay — from the image the stack
      # pins. Exit 0 means "a real Alertmanager would load this", which is still not
      # delivery; the last step in this job is.
      - name: the receiver's config loads in Alertmanager
        run: |
          docker run --rm \
            -v "$PWD/ops/alertmanager:/etc/alertmanager:ro" \
            --entrypoint /bin/amtool "prom/alertmanager:${AM_VERSION}" \
            check-config /etc/alertmanager/alertmanager.yml

      # The smoke's config, which no other step reads: `smoke.yml` loads
      # `smoke-rules.yml` and aims at the same receiver. Validated here so a typo in
      # either file is this job going red in ten seconds, rather than the delivery step
      # below failing a hundred and twenty seconds later with a parse error that reads
      # like a delivery failure.
      - name: the delivery smoke's own config loads
        run: |
          docker run --rm \
            -v "$PWD/ops/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool "prom/prometheus:${PROM_VERSION}" \
            check config /etc/prometheus/smoke.yml

      # Written in Python rather than sed so it is the same check here and on a
      # developer's machine: `v2.55.0` in this file plus `v2.55.0` in
      # docker-compose.yml is two places, and the interesting failure is the day
      # one of them moves. `D10-116` made that true of the receiver as well, and
      # widened the check rather than copying it, because a second near-identical
      # block is where one of the two pins stops being compared.
      - name: the stack and this job pin the same images
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          compose = pathlib.Path("docker-compose.yml").read_text(encoding="utf-8")
          wanted = {
              "prom/prometheus": os.environ["PROM_VERSION"],
              "prom/alertmanager": os.environ["AM_VERSION"],
          }
          for image, version in wanted.items():
              found = re.search(rf"image: {re.escape(image)}:(\S+)", compose)
              if not found:
                  sys.exit(f"docker-compose.yml no longer names a {image} image")
              tag = found.group(1).strip().strip('"')
              if tag != version:
                  sys.exit(f"docker-compose.yml pins {tag}, this job validates {version}")
              print(f"compose and CI both pin {image}:{tag}")
          PY

      # The Compose files are the only description of the stack, and a service
      # block with a path typo fails at `up` — days later, on someone else's
      # machine. The two variables are the ones Compose refuses to interpolate
      # without; `.env` is copied because the worker services declare it.
      - name: docker compose accepts the stack
        run: |
          cp .env.example .env
          MYSQL_ROOT_PASSWORD=ci MYSQL_PASSWORD=ci docker compose config -q

      # D10-116. Every step above asks a loader whether a file is well formed, and all
      # of them would pass on a stack where nobody is ever told anything. This is the
      # only step that answers the question `D10-111` left open by name — "the rule
      # fires into an empty `ALERTS`, nobody paged" — because it waits for the mail to
      # arrive in a mailbox:
      #
      #   prometheus (smoke.yml, `up == 1`) -> alertmanager (email receiver) -> SMTP ->
      #   mailpit -> asserted over Mailpit's HTTP API
      #
      # Why a separate config rather than the stack's own: `ops/prometheus/rules.yml`
      # alerts on `increase(escalation_email_failed_total[1h]) > 0`, which only moves
      # when a real worker's real relay refuses a real mail. Nothing can make that fire
      # on a runner without a worker and a broken relay, so executing it would prove
      # nothing about delivery. `ops/prometheus/smoke.yml` runs in its place — same
      # `/etc/prometheus` mount, same `alertmanager:9093` target — with one rule that is
      # `up == 1`: true of a working Prometheus, false of a broken one, and needing no
      # fixture. The script also asserts statically that the smoke and the stack name
      # the *same* receiver and that the stack loads the file declaring the real alert,
      # so "the smoke proved a different config" cannot be the pass.
      #
      # Three containers, started by the script under the network aliases the configs
      # resolve (`prometheus`, `alertmanager`, `mailpit`) rather than under those
      # container names, so this runs beside a developer's real stack instead of
      # refusing to start until it is stopped. Image tags are read out of
      # `docker-compose.yml`, so it cannot prove a hop the stack does not have.
      #
      # What it does not prove: that `EscalationEmailFailed` itself was delivered. It
      # proves the path is real, which is exactly the claim `D10-111` could not make.
      - name: a firing rule reaches a mailbox (prometheus -> alertmanager -> mailpit)
        run: python3 backend/tests/smoke_alert_delivery.py

  # ------------------------------------------------------------------- image
  # `Dockerfile.backend` is the artifact `docker-compose.yml` runs, and until this
  # job existed nothing in this repository built it: no `docker build` appeared
  # anywhere in this file, so the only thing that ever constructed it was
  # `docker compose up` on somebody's machine — and that is not a gate. Every
  # failure it can carry is silent until then: a `requirements.txt` pin that does
  # not resolve for 3.13, a `COPY` of a path that moved, `USER app` dropped while
  # making something write. The suite above cannot see any of them, because it
  # runs from a checkout with a prepared interpreter, not from this file.
  #
  # The worker list is *read out of* `docker-compose.yml` rather than restated
  # here, for the same reason the Prometheus tag lives in `env:` above: a second
  # copy is a second thing to forget. A seventh worker added to the stack is
  # imported by this job on the next run without anybody editing it.
  #
  # The last step runs a real worker to completion rather than importing it,
  # because "the module imports" and "the process works" are different claims:
  # `--once` drains the expiry sweep, which queries, commits and exits with a
  # status, against a throwaway SQLite file so no service container is needed.
  # That also happens to be the first time any worker has been started from this
  # image at all (`D10-112`).
  image:
    name: image (docker build, every entry point)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build the image the stack runs
        run: docker build -f Dockerfile.backend -t contract-agent-api:ci .

      # Both images are built here, at the top, because the account assertion
      # below checks them both and `D10-128` first put it the other way round: the
      # loop named `contract-agent-frontend:ci` ninety lines before the step that
      # built it, and `docker run` on an image that does not exist is a failure, not
      # a skip. Found by this job, on the first run of the slice.
      #
      # `--build-arg` deliberately, because Compose supplies the proxy address
      # through `build.args` and CI should exercise the same path. An image that
      # stopped declaring the `ARG` would silently ignore this, bake in the
      # `next.config.ts` fallback, and the proxy step below would fail -- which is
      # the point of passing it here.
      - name: build the image the stack serves
        run: |
          docker build --build-arg API_PROXY_URL=http://api:8000 \
            -f Dockerfile.frontend -t contract-agent-frontend:ci .

      # `USER app` is the line that keeps a compromised request from being a
      # compromised host, and it is one word wide: deleting it changes nothing a
      # test can see. Asserted as an id, not read back from the Dockerfile.
      #
      # Both images, from one loop rather than two copies: `D10-128` gave the stack
      # a second account to get right, and a second near-identical block is where
      # one of the two stops being compared (`D10-116` made the same argument about
      # the Prometheus and Alertmanager pins).
      - name: the containers run as the unprivileged account
        run: |
          for image in contract-agent-api:ci contract-agent-frontend:ci; do
            uid=$(docker run --rm --entrypoint id "$image" -u)
            if [ "$uid" != "1001" ]; then
              echo "::error::$image runs as uid $uid, not the unprivileged 1001"
              exit 1
            fi
            echo "$image runs as uid $uid"
          done

      - name: every process the stack starts imports inside it
        run: |
          modules=$(python3 -c 'import pathlib,re; c=pathlib.Path("docker-compose.yml").read_text(encoding="utf-8"); f=sorted(set(re.findall(r"^\s+- (app\.workers\.[a-z_]+)$", c, re.M))); assert len(f) >= 6, f"expected at least six worker entry points in docker-compose.yml, found {len(f)}"; print(", ".join(f))')
          echo "importing app.main, $modules"
          docker run --rm contract-agent-api:ci python -c "import app.main, $modules"

      # Liveness, not readiness: nothing here provisions MySQL, and `/health` is
      # the probe that deliberately answers without touching a dependency. The
      # metric is the point of the step — `escalation_email_failed_total` at zero
      # before its first increment is what `D10-109` fixed, and this is the only
      # place that reads it out of the *shipped* artifact rather than a test.
      - name: the API answers liveness and publishes its metrics from the image
        run: |
          docker run -d --name image-api -p 127.0.0.1:18000:8000 contract-agent-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18000/health
          echo
          scrape=$(curl -fsS http://127.0.0.1:18000/metrics)
          sample=$(echo "$scrape" | grep -E '^escalation_email_failed_total ')
          if [ "$sample" != "escalation_email_failed_total 0" ]; then
            echo "::error::expected the seeded zero, got: ${sample:-<no sample>}"
            exit 1
          fi
          echo "$sample"

      # D10-114. Until this, the image shipped `app/` and nothing else: no
      # `alembic.ini`, no `migrations/`, so `alembic` in the container had no script
      # directory at all and the tick below had to conjure its schema with
      # `Base.metadata.create_all` — a schema built from the models, which is the one
      # schema nobody deploys. This applies the chain the image carries and reads the
      # revision back out of the database. It asserts `(head)` rather than a revision
      # number, so adding a migration needs no edit here: the claim is "the database
      # agrees with the shipped scripts", and a `script_location` that resolved to the
      # wrong directory would leave `current` empty rather than at head.
      - name: the image applies the migrations it ships
        run: |
          docker run --rm --tmpfs /data \
            -e DATABASE_URL=sqlite+pysqlite:////data/ci.db \
            contract-agent-api:ci sh -c "alembic upgrade head && alembic current" 2>&1 \
            | tee "$RUNNER_TEMP/migrate.log"
          grep -q '(head)' "$RUNNER_TEMP/migrate.log" \
            || { echo "::error::alembic current did not report the script head"; exit 1; }

      # The same chain, then a real worker running on the schema it produced.
      # `create_all` no longer stands in for the migrations anywhere in this job, so
      # what completes a tick here is the sweep against the tables operators deploy.
      - name: a worker completes a tick on the migrated schema
        run: |
          docker run --rm --tmpfs /data \
            -e DATABASE_URL=sqlite+pysqlite:////data/ci.db \
            contract-agent-api:ci sh -c "alembic upgrade head && python -m app.workers.expiry --once" \
            | tee "$RUNNER_TEMP/tick.log"
          grep -q expiry_sweep_drained "$RUNNER_TEMP/tick.log" \
            || { echo "::error::the sweep logged no drained verdict"; exit 1; }

      # D10-128. The second image, and the first one in this repository whose
      # failure mode is a *page*. Three defects survive `docker build` with exit 0
      # and are invisible to every test above:
      #
      #   - `output: "standalone"` removed from `frontend/next.config.ts`: the build
      #     produces no `standalone/` directory at all, so the `COPY --from=build`
      #     fails loudly. Fine — the next item is the silent one.
      #   - the `.next/static` copy dropped: the page still answers 200 with correct
      #     HTML whose every `/_next/static/…` asset is a 404. It renders unstyled
      #     and never hydrates, and nothing but a browser would notice.
      #   - `HOSTNAME=0.0.0.0` dropped: the standalone server binds loopback inside
      #     the container, so the published port answers nothing while the
      #     HEALTHCHECK — which asks 127.0.0.1 from *inside* — reports healthy.
      #
      # So these steps fetch through the published port (loopback binds fail here),
      # follow an asset the HTML names (a missing static copy fails here), and call the
      # API's prefix through a stand-in container answering to the name the image baked
      # in (a build argument that never arrived fails here, as a 500 instead of a 200).
      # The image itself is built at the top of this job, next to the API's.
      - name: the screen serves a page and the assets that page names
        run: |
          # A user-defined network, so `api` is a real name on it — the shape Compose
          # gives the stack and the name the rewrite was built with. The stand-in is the
          # frontend image with a different entry point: nothing extra to pull, and no
          # database, because nothing here asks the API a question. It answers every path
          # with a marker, so a 200 carrying that marker can only mean the rewrite
          # reached *this* container.
          #
          # Names distinct from `image-api` above on purpose: that container is still
          # running and is only removed in the `always()` step at the end of the job,
          # so reusing the name is a conflict, not a tidy-up.
          docker network create ci-frontend
          docker run -d --name screen-api --network ci-frontend --network-alias api \
            --entrypoint node contract-agent-frontend:ci \
            -e "require('http').createServer((q, s) => { s.writeHead(200, {'content-type': 'application/json'}); s.end(JSON.stringify({standin: true, path: q.url})); }).listen(8000, '0.0.0.0')"
          docker run -d --name screen-frontend --network ci-frontend \
            -p 127.0.0.1:13000:3000 contract-agent-frontend:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:13000/en >"$RUNNER_TEMP/en.html" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS -o /dev/null -w 'page: %{http_code}\n' http://127.0.0.1:13000/en

          asset=$(grep -oE '/_next/static/[A-Za-z0-9._/-]+\.(js|css)' "$RUNNER_TEMP/en.html" | head -n1)
          if [ -z "$asset" ]; then
            echo "::error::the served page names no /_next/static asset; is it HTML at all?"
            exit 1
          fi
          echo "asset: $asset"
          curl -fsS -o /dev/null -w 'asset: %{http_code}\n' "http://127.0.0.1:13000$asset"

      # The proxy is the reason the browser only ever talks to one origin, and `D10-128`
      # measured that its destination is fixed when the image is built, not when a
      # request is served: a container whose `environment:` said `http://api:8000` still
      # dialled `127.0.0.1:8000` and logged ECONNREFUSED. So this asserts the whole
      # chain positively — the published port, the rewrite, the name `api`, and port
      # 8000 in the destination. Only a 200 carrying the stand-in's marker proves all
      # four at once: a 500 means the build was handed no address, a 404 means the
      # rewrite is gone, and a 502 means the name did not resolve.
      - name: the proxy reaches the address baked into the image
        run: |
          curl -fsS -o "$RUNNER_TEMP/proxied.json" -w 'proxied: %{http_code}\n' \
            http://127.0.0.1:13000/api/v1/health
          cat "$RUNNER_TEMP/proxied.json"
          echo
          grep -q '"standin":true' "$RUNNER_TEMP/proxied.json" \
            || { echo "::error::the rewrite did not reach the container aliased 'api'"; exit 1; }
          grep -q '/api/v1/health' "$RUNNER_TEMP/proxied.json" \
            || { echo "::error::the rewrite did not carry the path it was given"; exit 1; }

      - name: remove the containers
        if: always()
        run: |
          docker rm -f image-api screen-api screen-frontend || true
          docker network rm ci-frontend || true

  # --------------------------------------------------------------------- gate
  # One job to name as a required status check, instead of the eight that have to be
  # re-listed whenever a job is added. `if: always()` is what makes it run when
  # an upstream job failed — otherwise the gate would be skipped, and a skipped
  # required check is a green light.
  #
  # Nothing requires it today, and `D10-75` measured that rather than assuming
  # it: the branches API reports `main` as `"protected": false` with
  # `required_status_checks.enforcement_level: "off"`. So this job is an
  # observer, not an enforcer — a direct push to `main` lands whether the run
  # above it is green or red, which is the same bypass this file exists to
  # close. Naming it in branch protection is a repository setting; no line
  # here can perform it, and until it is named, the honest reading of a red run
  # is "somebody looked", not "the push was stopped".
  gate:
    name: CI gate
    if: always()
    needs:
      - python-static
      - backend-tests
      - mysql-integration
      - frontend
      - demo-frontend
      - hygiene
      - observability
      - image
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$failed" ]; then
            echo "::error::failed or skipped jobs: $(echo $failed)"
            exit 1
          fi
          echo "all required jobs succeeded"
