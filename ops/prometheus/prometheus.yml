# Prometheus scrape config for contract-agent local dev.
# Scrapes the FastAPI /metrics endpoint on the host.
#
# Docker container reaches host via host.docker.internal (Docker Desktop).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: dev

# Alertmanager (not deployed in M4 — placeholder)
alerting:
  alertmanagers: []

# Rules loaded from separate files
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: contract-agent-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: contract-agent
          component: backend
