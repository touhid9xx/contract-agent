# Alembic configuration for the backend schema.
#
# The database URL is deliberately NOT hard-coded here. migrations/env.py
# resolves it from Settings (with DATABASE_URL taking precedence), so there is
# exactly one source of truth for connection details and no credential ever
# lands in a committed file.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Alembic 1.20 renamed this key for ``prepend_sys_path``; set both so the file
# works on either version without a deprecation warning.
path_separator = os
# Replaced at runtime by migrations/env.py.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
